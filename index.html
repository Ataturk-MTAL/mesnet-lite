<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MESNET.Lite</title>
    <style>
      /* OpenVue, PrimeVue 4.5.5 tabanlıdır ve 14px kök font varsayar. */
      html { font-size: 14px; }

      *,
      *::before,
      *::after { box-sizing: border-box; }

      /* OpenVue teması font ailesi tanımlamaz; tanımlanmazsa tarayıcı
         varsayılanı (serif) devreye girer. Sistem font yığını kullanılır. */
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue',
          Arial, 'Noto Sans', sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        color: var(--p-text-color);
        /* Sayfa zemini kart yüzeyinden bir ton farklı olmalı; aksi hâlde
           Card ve DataTable arka planla aynı renge düşüp sınırları kaybolur. */
        background: var(--p-surface-100);
      }

      html.app-dark body { background: var(--p-surface-950); }

      /* Başlıklar ve form öğeleri de aynı yığını kullanmalı; tarayıcı
         form öğelerine kendi fontunu dayatır. */
      h1, h2, h3, h4, h5, h6,
      button, input, select, textarea { font-family: inherit; }

      #app { min-height: 100vh; }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
