[package]
name = "mesnet-lite"
version = "0.1.2"
description = "İşletmelerde mesleki eğitim koordinatörlük dağıtımı ve ek ders saati takdiri"
authors = ["Hakan Gülen"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ataturk-MTAL/mesnet-lite"

[lib]
# `_lib` soneki Windows'ta bin adıyla çakışmayı önlemek için gereklidir.
name = "mesnet_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.79"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time"] }
csv = "1.3"
# e-Okul sınıf listelerini okumak için: eski BIFF/OLE2 `.XLS` biçimi
# (Crystal Reports üretimi) yalnız bu crate ile okunabiliyor; `rust_xlsxwriter`
# yalnız YAZAR, `xlsx`/OOXML okuyucuları bu eski biçimi tanımaz.
calamine = "0.36"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
typst-as-lib = "0.16"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
# PIN'ler özetlenerek saklanır. Uygulama tek makinede çalışır ve veritabanı
# korumasızdır; özetleme kimseyi dışarıda tutmaz ama açık parola saklamamak
# yine de doğru olanıdır. `std` özelliği: tuz üretimi için işletim sisteminin
# CSPRNG'sine (`OsRng`) ihtiyaç var, bu da `rand_core`nun `getrandom`
# özelliğini gerektiriyor — varsayılan özellik kümesi bunu getirmiyor.
argon2 = { version = "0.5", features = ["std"] }
# Sürüm parmak izi (`services::versions`): kullanıcı tablolarının deterministik
# içerik özeti. `argon2`nin zaten transitif olarak getirdiği sürümle (bkz.
# Cargo.lock) aynı major/minor'a kilitlenir; PIN özetleme ile karıştırılmasın
# diye ayrı, doğrudan bir bağımlılık olarak eklendi.
sha2 = "0.10"
hex = "0.4"
# `services::versions::open_version` bir sürümü GEÇİCİ bir kopyaya açar; bu
# artık yalnız testte değil üretimde de çalışıyor, bu yüzden burada.
tempfile = "3"

[dev-dependencies]
# Gömülü fontların Türkçe gliflerini içerdiğini testte doğrulamak için.
ttf-parser = "0.25"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
